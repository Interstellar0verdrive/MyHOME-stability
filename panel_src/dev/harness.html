<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyHOME panel — development harness</title>
<!--
  A page for looking at the panel without a Home Assistant.

  It is not shipped and it is not a test: it loads the committed bundle, hands the element
  the four properties Home Assistant hands it, and answers the two read commands with the
  real fixture (tests/fixtures/panel_overview_example.json, regenerated by the Python suite
  from the real server) and the real strings.json. That is enough to see every state the
  overview has, in both themes, at any width, and to check that nothing in the shadow root
  depends on an element only the frontend defines.

  Serve the repository root over HTTP and open /panel_src/dev/harness.html:

      python3 -m http.server 8765
-->
<style>
  body { margin: 0; font-family: Roboto, system-ui, sans-serif; }
  #bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: #eceef2; font-size: 13px; }
  #bar label { display: inline-flex; gap: 4px; align-items: center; }
  #host { min-height: calc(100vh - 44px); }
  .dark { --primary-color:#4fc3f7; --accent-color:#ffb74d; --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b;
          --disabled-text-color:#6f6f6f; --primary-background-color:#111; --secondary-background-color:#333;
          --card-background-color:#1c1c1c; --divider-color:rgba(225,225,225,.12); --error-color:#ef5350;
          --warning-color:#ffb04c; --success-color:#66bb6a; --info-color:#4fc3f7; --app-header-background-color:#101e24;
          --app-header-text-color:#e1e1e1; --text-primary-color:#0b1417; --snack-action-color:#8a5300; background:#111; }
</style>
<div id="bar">
  <label><input type="checkbox" id="dark" /> dark</label>
  <label><input type="checkbox" id="narrow" /> narrow</label>
  <label><input type="checkbox" id="measuring" /> measuring</label>
  <label><input type="checkbox" id="empty" /> no profiles</label>
  <label><input type="checkbox" id="advanced" /> no basic covers</label>
  <label><input type="checkbox" id="fail" /> overview refuses</label>
  <span id="note"></span>
</div>
<div id="host"></div>
<script type="module">
  import "../../custom_components/myhome/frontend/myhome-panel.js";

  const base = new URL("../../", import.meta.url);
  const [fixture, strings] = await Promise.all([
    fetch(new URL("tests/fixtures/panel_overview_example.json", base)).then((r) => r.json()),
    fetch(new URL("custom_components/myhome/strings.json", base)).then((r) => r.json()),
  ]);

  const flags = {};
  for (const id of ["dark", "narrow", "measuring", "empty", "advanced", "fail"]) {
    const box = document.getElementById(id);
    flags[id] = () => box.checked;
    box.addEventListener("change", render);
  }

  const overview = () => {
    const answer = structuredClone(fixture);
    if (flags.measuring()) {
      answer.measuring = { cover_unique_id: answer.covers[0].unique_id, name: answer.covers[0].name };
    }
    if (flags.empty()) {
      answer.profiles = [];
      answer.covers = answer.covers.map((c) => ({ ...c, profile: null }));
    }
    if (flags.advanced()) {
      answer.no_basic_covers = true;
      answer.covers = [];
      answer.profiles = [];
    }
    return answer;
  };

  const connection = {
    sendMessagePromise(message) {
      if (message.type === "myhome/calibration/texts") {
        return Promise.resolve({ language: "en", requested: message.language, fallback: false,
                                 texts: { options: strings.options, selector: strings.selector } });
      }
      if (message.type === "myhome/calibration/overview") {
        return flags.fail()
          ? Promise.reject({ code: "not_found", message: "Config entry not loaded",
                             translation_key: "entry_not_loaded" })
          : Promise.resolve(overview());
      }
      return Promise.reject({ code: "unknown_command", message: "unknown command" });
    },
    subscribeMessage() {
      // The write half is not merged: this is the refusal the panel feature-detects.
      return Promise.reject({ code: "unknown_command", message: "unknown command" });
    },
  };

  const hass = { states: {}, connection, language: "en", locale: { language: "en" } };

  function render() {
    document.body.classList.toggle("dark", flags.dark());
    const host = document.getElementById("host");
    host.innerHTML = "";
    const panel = document.createElement("myhome-calibration-panel");
    panel.hass = hass;
    panel.narrow = flags.narrow();
    panel.route = { prefix: "/myhome-calibration", path: "/" };
    panel.panel = { title: "Profili e tapparelle", icon: null, url_path: "myhome-calibration",
                    config: { version: "0.6.0.dev" } };
    host.appendChild(panel);
    document.getElementById("note").textContent = "hash: " + (location.hash || "#/");
  }

  window.addEventListener("hashchange", () => {
    document.getElementById("note").textContent = "hash: " + (location.hash || "#/");
  });
  render();
</script>
