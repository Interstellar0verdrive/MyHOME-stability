<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>MyHOME panel — development harness</title>
<!--
  A page for looking at the panel without a Home Assistant.

  It is not shipped and it is not a test: it loads the committed bundle, hands the element
  the four properties Home Assistant hands it, and answers the panel's commands with the
  real fixture (tests/fixtures/panel_overview_example.json, regenerated by the Python suite
  from the real server) and the real strings.json.

  Since lot 7 it answers the **write half** too - `preview`, `assign`, `reorder`, `undo`
  and `subscribe` - against a mutable copy of that fixture, so the whole loop can be walked
  offline: grab a row, drop it in another group, review it, confirm it, undo it. The stub
  server keeps one undo slot, exactly as the real one does, and hands the same refusal
  shapes back (`translation_key` plus an English `message`) so the refusal path can be seen
  without breaking anything.

  Lot 9 added two switches for the states that only show up at scale or on a bad line.
  "40 covers" builds a gateway of forty shutters across six profiles, with three names long
  enough to wrap and truncate and three areas empty - the scrolling, the FLIP and the
  drag auto-scroll are worth looking at there rather than at twelve. "socket down" fires
  the connection's own `disconnected` and `ready` events, which is how Home Assistant
  restarting looks from inside the panel.

  Lot 8 added the two routed cards, so it answers `cover_detail`, `cover_edit`,
  `set_travel`, `cover_forget`, `profile_edit`, `profile_rename` and `profile_delete`, and
  takes `profile_values` on a preview. Walk them at `#/cover/<unique id>` and
  `#/profile/tall`, or by clicking a row and a group heading. The "travel from the file"
  box decides whether a removal would leave the curtain travel behind, which is the one
  fact the confirmation cannot work out for itself.

  **The arithmetic in `preview` below is the stub's, not the panel's.** The panel is
  forbidden from scaling a profile (that is the parity invariant); a fake server is not,
  because it is standing in for the one that does. The numbers it produces are roughly
  right and are not the ones a real installation would see.

  Serve the repository root over HTTP and open /panel_src/dev/harness.html:

      python3 -m http.server 8765
-->
<style>
  body { margin: 0; font-family: Roboto, system-ui, sans-serif; }
  #bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: #eceef2; font-size: 13px; }
  #bar label { display: inline-flex; gap: 4px; align-items: center; }
  #host { min-height: calc(100vh - 44px); }
  .dark { --primary-color:#4fc3f7; --accent-color:#ffb74d; --primary-text-color:#e1e1e1; --secondary-text-color:#9b9b9b;
          --disabled-text-color:#6f6f6f; --primary-background-color:#111; --secondary-background-color:#333;
          --card-background-color:#1c1c1c; --divider-color:rgba(225,225,225,.12); --error-color:#ef5350;
          --warning-color:#ffb04c; --success-color:#66bb6a; --info-color:#4fc3f7; --app-header-background-color:#101e24;
          --app-header-text-color:#e1e1e1; --text-primary-color:#0b1417; --snack-action-color:#8a5300; background:#111; }
</style>
<div id="bar">
  <label><input type="checkbox" id="dark" /> dark</label>
  <label><input type="checkbox" id="narrow" /> narrow</label>
  <label><input type="checkbox" id="measuring" /> measuring</label>
  <label><input type="checkbox" id="empty" /> no profiles</label>
  <label><input type="checkbox" id="advanced" /> no basic covers</label>
  <label><input type="checkbox" id="fail" /> overview refuses</label>
  <label><input type="checkbox" id="refuse" /> writes refuse</label>
  <label><input type="checkbox" id="live" checked /> live updates</label>
  <label><input type="checkbox" id="filetravel" /> travel from the file</label>
  <label><input type="checkbox" id="twogateways" /> two gateways</label>
  <label><input type="checkbox" id="bulk" /> 40 covers</label>
  <label><input type="checkbox" id="offline" /> socket down</label>
  <button type="button" id="reset">reset the gateway</button>
  <span id="note"></span>
</div>
<div id="host"></div>
<script type="module">
  import "../../custom_components/myhome/frontend/myhome-panel.js";

  const base = new URL("../../", import.meta.url);
  const [fixture, strings] = await Promise.all([
    fetch(new URL("tests/fixtures/panel_overview_example.json", base)).then((r) => r.json()),
    fetch(new URL("custom_components/myhome/strings.json", base)).then((r) => r.json()),
  ]);

  // A twelfth shutter nobody has ever measured: the window with no travel, which is what
  // the review panel's "corse mancanti" form exists for. Without one the form is
  // unreachable from this page.
  const extra = {
    ...structuredClone(fixture.covers[0]),
    unique_id: "aa:bb:cc:dd:ee:ff-2-84",
    entity_id: "cover.attic_shutter",
    name: "Attic Shutter",
    area: null,
    area_id: null,
    height: null,
    profile: null,
    profile_from_file: false,
    profile_missing: false,
    origin: "defaults",
    source: "yaml",
    has_own: [],
    level: null,
    verify_note: null,
    measured_at: null,
    order_index: 2,
  };

  // Forty shutters over six profiles: what a big house does to the scrolling, to the FLIP
  // and to the auto-scroll between groups, and where a name long enough to wrap to two
  // lines and truncate has to stay readable. The numbers are the fixture's, varied a
  // little; the point of this switch is the quantity and the names, not the physics.
  const LONG_NAMES = [
    "Tapparella della camera da letto grande al primo piano",
    "Rolladen im Wohnzimmer neben der Terrassentur, links",
    "Persiana del soggiorno che da sul giardino sul retro",
  ];
  const ROOMS = ["Living room", "Kitchen", "Bedroom", "Studio", "Hallway", null, null];

  const bulk = () => {
    const answer = structuredClone(fixture);
    const base = answer.profiles[0];
    answer.profiles = Array.from({ length: 6 }, (_, index) => ({
      ...structuredClone(base),
      name: ["tall", "short", "wide", "veranda", "garage", "loft"][index],
      reference_height: 120 + index * 22,
      values: Object.fromEntries(
        Object.entries(base.values).map(([key, value]) => [key, value * (1 + index * 0.07)]),
      ),
      followers: [],
      followers_from_file: [],
      measured_on: index % 3 === 0 ? null : base.measured_on,
      measured_on_name: index % 3 === 0 ? null : base.measured_on_name,
      measured_at: index % 3 === 0 ? null : base.measured_at,
    }));
    const template = answer.covers[0];
    answer.covers = Array.from({ length: 40 }, (_, index) => {
      const profile = index % 7 === 6 ? null : answer.profiles[index % 6].name;
      return {
        ...structuredClone(template),
        unique_id: `aa:bb:cc:dd:ee:ff-2-${100 + index}`,
        entity_id: `cover.bulk_${index}`,
        name: index < LONG_NAMES.length ? LONG_NAMES[index] : `Shutter ${index + 1}`,
        area: ROOMS[index % ROOMS.length],
        area_id: ROOMS[index % ROOMS.length] ? `area_${index % ROOMS.length}` : null,
        height: index % 9 === 8 ? null : 110 + (index % 11) * 17,
        profile,
        profile_from_file: false,
        profile_missing: false,
        origin: profile ? (index % 4 === 0 ? "adjusted" : "inherited") : "defaults",
        source: profile ? `profile ${profile}` : "yaml",
        has_own: index % 4 === 0 ? ["opening_time"] : [],
        order_index: index,
      };
    });
    answer.order = answer.covers.map((cover) => cover.unique_id);
    return answer;
  };

  const fresh = () => {
    if (document.getElementById("bulk").checked) {
      return bulk();
    }
    const answer = structuredClone(fixture);
    answer.covers = [...answer.covers, structuredClone(extra)];
    answer.order = answer.covers.map((c) => c.unique_id);
    return answer;
  };

  let gateway = fresh();
  let undoSlot = null;
  let subscriber = null;

  const flags = {};
  // Two kinds of flag. The first change what the element is handed and rebuild it; the
  // second change what the *server* says, and are pushed down the subscription instead -
  // which is the only way to see a measurement starting while changes are already pending,
  // and that is a state with a sentence of its own on the bar.
  for (const id of ["dark", "narrow", "empty", "advanced", "fail", "twogateways"]) {
    const box = document.getElementById(id);
    flags[id] = () => box.checked;
    box.addEventListener("change", render);
  }
  for (const id of ["measuring", "refuse", "live", "filetravel"]) {
    const box = document.getElementById(id);
    flags[id] = () => box.checked;
    box.addEventListener("change", () => {
      if (id === "measuring" && subscriber) {
        const cover = gateway.covers[0];
        subscriber(box.checked
          ? { type: "measuring", cover_unique_id: cover.unique_id, name: cover.name }
          : { type: "measuring", cover_unique_id: null, name: null });
      }
    });
  }
  document.getElementById("reset").addEventListener("click", () => {
    gateway = fresh();
    undoSlot = null;
    render();
  });
  document.getElementById("bulk").addEventListener("change", () => {
    gateway = fresh();
    undoSlot = null;
    render();
  });

  // The socket's own lifecycle, which is what the panel listens to so that it stops
  // claiming to be live while Home Assistant restarts. The real Connection dispatches
  // these itself and replays its subscriptions afterwards; here the checkbox does it.
  const socketListeners = { ready: [], disconnected: [] };
  const socketEvent = (type) => {
    for (const callback of socketListeners[type] ?? []) {
      callback(connection);
    }
  };
  document.getElementById("offline").addEventListener("change", (event) => {
    socketEvent(event.target.checked ? "disconnected" : "ready");
  });

  // A second gateway, so the header's picker has something to pick. The stub has one set
  // of shutters and hands them back whichever is asked for - what is being exercised here
  // is the control and the resubscription, not two houses.
  const SECOND_ENTRY = { entry_id: "01SECONDGATEWAY", title: "Cascina", mac: "00:03:50:dd:ee:ff", loaded: true };

  const overview = (entryId) => {
    const answer = structuredClone(gateway);
    if (flags.twogateways()) {
      answer.entries = [answer.entries[0], SECOND_ENTRY];
      answer.entry_id = entryId ?? answer.entry_id;
    }
    answer.covers.forEach((cover, index) => { cover.order_index = index; });
    // Every profile's follower lists, rebuilt so the group headers stay honest.
    for (const profile of answer.profiles) {
      profile.followers = answer.covers
        .filter((c) => c.profile === profile.name && !c.profile_from_file)
        .map((c) => c.unique_id);
    }
    if (flags.measuring()) {
      answer.measuring = { cover_unique_id: answer.covers[0].unique_id, name: answer.covers[0].name };
    }
    if (flags.empty()) {
      answer.profiles = [];
      answer.covers = answer.covers.map((c) => ({ ...c, profile: null }));
    }
    if (flags.advanced()) {
      answer.no_basic_covers = true;
      answer.covers = [];
      answer.profiles = [];
    }
    return answer;
  };

  const refuse = (key, message, placeholders = {}) =>
    Promise.reject({ code: "service_validation_error", message,
                     translation_key: key, translation_placeholders: placeholders });

  const profileOf = (name) => gateway.profiles.find((p) => p.name === name) ?? null;
  const coverOf = (id) => gateway.covers.find((c) => c.unique_id === id) ?? null;
  const travelOf = (item, cover) =>
    item.height !== undefined && item.height !== null ? Number(String(item.height).replace(",", ".")) : cover.height;

  // The stub's own arithmetic, standing in for `derive_cover_from_profile`. Roughly the
  // real shape - the roll grows with the amount of curtain on the tube - and deliberately
  // not exact: what is being exercised here is the screen, not the physics.
  const scaled = (profile, travel) => {
    const ratio = travel / (profile.reference_height || travel);
    const grow = (k) => Math.sqrt(1 + (k * k - 1) * ratio);
    const closing = grow(profile.values.closing_roll);
    const curtain = profile.values.closing_roll - 1 > 0.01
      ? (closing - 1) / (profile.values.closing_roll - 1) : ratio;
    const slat = profile.values.slat_time * ratio;
    return {
      opening_time: slat + (profile.values.opening_time - profile.values.slat_time) * curtain,
      closing_time: slat + (profile.values.closing_time - profile.values.slat_time) * curtain,
      slat_time: slat,
      opening_roll: grow(profile.values.opening_roll),
      closing_roll: closing,
      roll: closing,
      stop_latency: 0.4,
      start_delay: 0.3,
    };
  };

  const previewItem = (item) => {
    const cover = coverOf(item.cover_unique_id);
    const blank = { cover_unique_id: item.cover_unique_id, profile: item.profile ?? null,
                    height: null, problem: null, origin: null, source: null,
                    values: {}, keys: [], has_own: [] };
    if (!cover) return { ...blank, problem: "unknown_cover" };
    const profile = item.profile === null ? null : profileOf(item.profile);
    if (item.profile !== null && !profile) return { ...blank, problem: "unknown_profile" };
    const travel = travelOf(item, cover);
    if (item.height !== undefined && item.height !== null && !Number.isFinite(travel)) {
      return { ...blank, problem: "not_a_number" };
    }
    if (Number.isFinite(travel) && (travel < 20 || travel > 500)) {
      return { ...blank, problem: "out_of_range" };
    }
    if (profile && (travel === null || travel === undefined)) {
      return { ...blank, problem: "missing_travel" };
    }
    const base = profile ? scaled(profile, travel) : { ...cover.values };
    const values = { ...base };
    for (const key of cover.has_own) values[key] = cover.values[key];
    const origin = profile
      ? cover.has_own.length === 0 ? "inherited" : "adjusted"
      : cover.has_own.length > 0 ? "measured" : "defaults";
    return {
      cover_unique_id: cover.unique_id,
      profile: item.profile ?? null,
      height: travel ?? null,
      problem: null,
      origin,
      source: profile ? `profile ${profile.name}` : "yaml",
      values,
      keys: Object.keys(values).map((key) => ({
        key, value: values[key],
        origin: cover.has_own.includes(key) ? "own" : profile ? "profile" : "default",
      })),
      has_own: [...cover.has_own],
    };
  };

  // --- the two routed cards (lot 8) -----------------------------------------------------
  // The five numbers a window can measure for itself, which is what both cards show and
  // both forms edit.
  const KEYS = ["opening_time", "closing_time", "slat_time", "opening_roll", "closing_roll"];

  const ownOf = (cover) => {
    const own = {};
    for (const key of cover.has_own) own[key] = cover.values[key];
    return own;
  };

  /** What `myhome.yaml` would say about this window, as far as this stub pretends to know. */
  const fileTravel = (cover) => (flags.filetravel() && cover.height !== null ? cover.height : null);

  const detailOf = (id) => {
    const cover = coverOf(id);
    if (!cover) return null;
    const profile = cover.profile ? profileOf(cover.profile) : null;
    const own = ownOf(cover);
    const inherited = profile && cover.height ? scaled(profile, cover.height) : null;
    const keys = KEYS.map((key) => {
      const isOwn = key in own;
      const under = inherited ? inherited[key] : null;
      return {
        key,
        value: cover.values[key],
        origin: isOwn ? "own" : profile ? "profile" : "default",
        own: isOwn,
        inherited_value: under ?? (isOwn ? null : cover.values[key]),
        inherited_origin: profile ? "inherited" : "defaults",
        profile_value: under,
        file_value: null,
        default_value: profile ? null : cover.values[key],
      };
    });
    // With the record gone: only a `profile:` line in the file survives, and this stub
    // has none, so every window falls back to the file or to the defaults.
    return {
      entry_id: gateway.entry_id,
      cover: structuredClone(cover),
      keys,
      forget: {
        falls_back_to: cover.profile_from_file ? "profile" : "defaults",
        profile: cover.profile_from_file ? cover.profile : null,
        travel_stays: fileTravel(cover) !== null,
      },
    };
  };

  /** Re-resolve one window after a write, the way the server would on the next read. */
  const resettle = (cover) => {
    const profile = cover.profile ? profileOf(cover.profile) : null;
    const own = ownOf(cover);
    const base = profile && cover.height ? scaled(profile, cover.height) : { ...cover.values };
    cover.values = { ...base, ...own };
    cover.origin = profile
      ? cover.has_own.length === 0 ? "inherited" : "adjusted"
      : cover.has_own.length > 0 ? "measured" : "defaults";
    cover.source = profile ? `profile ${profile.name}` : "yaml";
  };

  const publish = () => {
    if (subscriber && flags.live()) {
      subscriber({ type: "overview", overview: overview() });
    }
  };

  const connection = {
    sendMessagePromise(message) {
      if (message.type === "myhome/calibration/texts") {
        return Promise.resolve({ language: "en", requested: message.language, fallback: false,
                                 texts: { options: strings.options, selector: strings.selector,
                                          exceptions: strings.exceptions, panel: strings.config_panel } });
      }
      if (message.type === "myhome/calibration/overview") {
        return flags.fail()
          ? Promise.reject({ code: "not_found", message: "Config entry not loaded",
                             translation_key: "entry_not_loaded" })
          : Promise.resolve(overview(message.entry_id));
      }
      if (message.type === "myhome/calibration/cover_detail") {
        const detail = detailOf(message.cover_unique_id);
        return detail
          ? Promise.resolve(detail)
          : Promise.reject({ code: "not_found", message: "No such cover",
                             translation_key: "unknown_cover" });
      }
      if (message.type === "myhome/calibration/preview") {
        // `profile_values` replaces a profile's numbers for the length of the answer and
        // nothing else - the profile card's impact preview, contract section 11.
        const saved = new Map();
        for (const [name, values] of Object.entries(message.profile_values ?? {})) {
          const profile = profileOf(name);
          if (!profile) continue;
          saved.set(name, { values: profile.values, reference_height: profile.reference_height });
          const { reference_height, ...rest } = values;
          profile.values = { ...profile.values, ...rest };
          profile.reference_height = Number(String(reference_height).replace(",", "."));
        }
        const items = message.items.map(previewItem);
        for (const [name, before] of saved) Object.assign(profileOf(name), before);
        return Promise.resolve({ entry_id: gateway.entry_id, items });
      }
      if (flags.measuring() && message.type.startsWith("myhome/calibration/")) {
        return Promise.reject({ code: "not_allowed", message: "A guided calibration is running",
                                translation_key: "busy_calibrating",
                                translation_placeholders: { cover: gateway.covers[0].name } });
      }
      if (message.type === "myhome/calibration/assign") {
        if (flags.refuse()) {
          return refuse("write_in_progress", "Another change is still being applied");
        }
        const previews = message.assignments.map(previewItem);
        const bad = previews.find((item) => item.problem !== null);
        if (bad) {
          const cover = coverOf(bad.cover_unique_id);
          return refuse(bad.problem, `${bad.cover_unique_id}: ${bad.problem}`,
                        { covers: cover ? cover.name : bad.cover_unique_id, count: "1",
                          profile: bad.profile ?? "", key: "Curtain travel", min: "20", max: "500" });
        }
        undoSlot = { token: "stub-undo", before: structuredClone(gateway) };
        for (const item of message.assignments) {
          const cover = coverOf(item.cover_unique_id);
          const answer = previews.find((p) => p.cover_unique_id === item.cover_unique_id);
          cover.profile = item.profile ?? null;
          cover.profile_from_file = false;
          cover.profile_missing = false;
          cover.height = answer.height;
          cover.values = answer.values;
          cover.origin = answer.origin;
          cover.source = answer.source;
        }
        if (message.order) {
          gateway.covers.sort((a, b) => message.order.indexOf(a.unique_id) - message.order.indexOf(b.unique_id));
          gateway.order = [...message.order];
        }
        publish();
        return Promise.resolve({ overview: overview(), undo_token: undoSlot.token,
                                 applied: message.assignments.length });
      }
      if (message.type === "myhome/calibration/reorder") {
        if (flags.refuse()) {
          return refuse("write_in_progress", "Another change is still being applied");
        }
        undoSlot = { token: "stub-undo", before: structuredClone(gateway) };
        gateway.covers.sort((a, b) => message.order.indexOf(a.unique_id) - message.order.indexOf(b.unique_id));
        gateway.order = [...message.order];
        publish();
        return Promise.resolve({ overview: overview(), undo_token: undoSlot.token });
      }
      if (message.type === "myhome/calibration/cover_edit") {
        if (flags.refuse()) return refuse("write_in_progress", "Another change is still being applied");
        const cover = coverOf(message.cover_unique_id);
        undoSlot = { token: "stub-undo", before: structuredClone(gateway) };
        const own = ownOf(cover);
        for (const [key, value] of Object.entries(message.overrides)) {
          if (value === null) delete own[key];
          else own[key] = Number(String(value).replace(",", "."));
        }
        cover.has_own = KEYS.filter((key) => key in own);
        cover.values = { ...cover.values, ...own };
        resettle(cover);
        publish();
        return Promise.resolve({ overview: overview(), undo_token: undoSlot.token });
      }
      if (message.type === "myhome/calibration/set_travel") {
        if (flags.refuse()) return refuse("write_in_progress", "Another change is still being applied");
        const cover = coverOf(message.cover_unique_id);
        undoSlot = { token: "stub-undo", before: structuredClone(gateway) };
        cover.height = message.height === null
          ? null : Number(String(message.height).replace(",", "."));
        resettle(cover);
        publish();
        return Promise.resolve({ overview: overview(), undo_token: undoSlot.token });
      }
      if (message.type === "myhome/calibration/cover_forget") {
        if (flags.refuse()) return refuse("write_in_progress", "Another change is still being applied");
        const cover = coverOf(message.cover_unique_id);
        const outcome = detailOf(cover.unique_id).forget;
        undoSlot = { token: "stub-undo", before: structuredClone(gateway) };
        cover.has_own = [];
        cover.measured_at = null;
        cover.level = null;
        cover.verify_note = null;
        if (!cover.profile_from_file) cover.profile = null;
        if (!outcome.travel_stays) cover.height = null;
        resettle(cover);
        publish();
        return Promise.resolve({ overview: overview(), undo_token: undoSlot.token,
                                 falls_back_to: outcome.falls_back_to, profile: outcome.profile });
      }
      if (message.type === "myhome/calibration/profile_edit") {
        if (flags.refuse()) return refuse("write_in_progress", "Another change is still being applied");
        const profile = profileOf(message.name);
        if (!profile) {
          return Promise.reject({ code: "not_found", message: "No such profile",
                                  translation_key: "unknown_profile",
                                  translation_placeholders: { profile: message.name } });
        }
        if (!profile.editable) {
          return Promise.reject({ code: "not_allowed", message: "That profile is in the file",
                                  translation_key: "profile_not_editable",
                                  translation_placeholders: { profile: message.name } });
        }
        undoSlot = { token: "stub-undo", before: structuredClone(gateway) };
        const number = (value) => Number(String(value).replace(",", "."));
        for (const key of KEYS) profile.values[key] = number(message.values[key]);
        profile.reference_height = number(message.reference_height);
        const affected = gateway.covers.filter((c) => c.profile === message.name);
        affected.forEach(resettle);
        publish();
        return Promise.resolve({ overview: overview(), undo_token: undoSlot.token,
                                 affected: affected.map((c) => c.unique_id) });
      }
      if (message.type === "myhome/calibration/profile_rename") {
        if (flags.refuse()) return refuse("write_in_progress", "Another change is still being applied");
        if (!/^[A-Za-z0-9_]+$/.test(message.new_name)) {
          return refuse("invalid_name", "That is not a usable profile name",
                        { profile: message.new_name });
        }
        if (profileOf(message.new_name)) {
          return refuse("name_in_use", "There is already a profile of that name",
                        { profile: message.new_name });
        }
        const profile = profileOf(message.name);
        undoSlot = { token: "stub-undo", before: structuredClone(gateway) };
        profile.name = message.new_name;
        const moved = gateway.covers.filter((c) => c.profile === message.name);
        moved.forEach((c) => { c.profile = message.new_name; resettle(c); });
        publish();
        return Promise.resolve({ overview: overview(), undo_token: undoSlot.token,
                                 moved: moved.length, from_file: [] });
      }
      if (message.type === "myhome/calibration/profile_delete") {
        if (flags.refuse()) return refuse("write_in_progress", "Another change is still being applied");
        const profile = profileOf(message.name);
        if (!profile?.editable) {
          return Promise.reject({ code: "not_allowed", message: "That profile is in the file",
                                  translation_key: "profile_not_editable",
                                  translation_placeholders: { profile: message.name } });
        }
        undoSlot = { token: "stub-undo", before: structuredClone(gateway) };
        const orphans = gateway.covers.filter((c) => c.profile === message.name && !c.profile_from_file);
        gateway.profiles = gateway.profiles.filter((p) => p.name !== message.name);
        orphans.forEach((c) => { c.profile = null; resettle(c); });
        publish();
        return Promise.resolve({ overview: overview(), undo_token: undoSlot.token,
                                 covers_affected: orphans.map((c) => c.unique_id), from_file: [] });
      }
      if (message.type === "myhome/calibration/undo") {
        if (!undoSlot || undoSlot.token !== message.undo_token) {
          return Promise.reject({ code: "not_found", message: "This change can no longer be undone",
                                  translation_key: "undo_expired" });
        }
        gateway = undoSlot.before;
        undoSlot = null;
        publish();
        return Promise.resolve({ overview: overview(), undo_token: null, undone: "assign" });
      }
      return Promise.reject({ code: "unknown_command", message: "unknown command" });
    },
    addEventListener(type, callback) {
      (socketListeners[type] ??= []).push(callback);
    },
    removeEventListener(type, callback) {
      socketListeners[type] = (socketListeners[type] ?? []).filter((one) => one !== callback);
    },
    subscribeMessage(callback, message) {
      if (!flags.live() || message.type !== "myhome/calibration/subscribe") {
        return Promise.reject({ code: "unknown_command", message: "unknown command" });
      }
      subscriber = callback;
      callback({ type: "overview", overview: overview(message.entry_id) });
      return Promise.resolve(async () => { subscriber = null; });
    },
  };

  const hass = { states: {}, connection, language: "en", locale: { language: "en" } };

  function render() {
    document.body.classList.toggle("dark", flags.dark());
    const host = document.getElementById("host");
    host.innerHTML = "";
    subscriber = null;
    const panel = document.createElement("myhome-calibration-panel");
    panel.hass = hass;
    panel.narrow = flags.narrow();
    panel.route = { prefix: "/myhome-calibration", path: "/" };
    panel.panel = { title: "Profili e tapparelle", icon: null, url_path: "myhome-calibration",
                    config: { version: "0.6.0.dev" } };
    host.appendChild(panel);
    document.getElementById("note").textContent = "hash: " + (location.hash || "#/");
  }

  window.addEventListener("hashchange", () => {
    document.getElementById("note").textContent = "hash: " + (location.hash || "#/");
  });
  render();
</script>
