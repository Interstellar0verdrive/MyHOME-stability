name: Panel

on:
  push:
  pull_request:
  workflow_dispatch:

# A branch pushed inside this repository would otherwise run the job twice (once
# for the push, once for the pull request).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          # The version the bundle in the tree was built with. esbuild's output is
          # stable across Node versions, but pinning the major keeps "it rebuilt
          # differently here" from ever being the explanation for a red diff.
          node-version: "26"
          cache: npm
          cache-dependency-path: panel_src/package-lock.json

      - name: Install
        working-directory: panel_src
        # `npm ci`, not `npm install`: it installs exactly what package-lock.json
        # pins and refuses to run without it, which is what makes the rebuild below
        # a comparison and not a coincidence.
        run: npm ci

      - name: Type-check
        working-directory: panel_src
        run: npm run check

      - name: Test
        working-directory: panel_src
        # The pure half of the panel under `node --test`: the pending model, the
        # sentences, the router, the Markdown renderer, the illustration check and
        # the options-flow opener. No browser and no new dependency - the runner
        # compiles each test with the esbuild the build already uses. The views are
        # walked by a person in `panel_src/dev/harness.html`; that boundary is the
        # handoff's open point and is stated there.
        run: npm test

      - name: Accessibility
        working-directory: panel_src
        # axe-core over the committed bundle in jsdom, in sixteen states; the flows
        # walked with the keyboard; and the contrast of every coloured surface in
        # both themes, worked out from the documented defaults of the theme
        # variables. All three are dev-only and none of them needs a browser.
        run: npm run a11y && npm run keyboard && npm run contrast

      - name: Live updates
        working-directory: panel_src
        # The committed bundle against a socket that drops, comes back and flaps,
        # counting how many subscriptions the panel is holding. A second one is
        # invisible from the screen and permanent, so it is the one thing here that
        # no screenshot and no person at a browser would ever catch.
        run: npm run socket

      - name: The calibration session
        working-directory: panel_src
        # The same bundle against a session that misbehaves: a snapshot the wizard
        # cannot draw (the error card appears and the presence signal goes on
        # arriving), a "Cancel" refused by another client and then by a socket that
        # is down (there is always a card with a way out on it), the address
        # opened with no session on the gateway (nothing is started) and a session
        # picked up again in the middle of a run (nothing is acted). These are the
        # failures the v2 panel shipped, and none of them is visible from a
        # screenshot.
        run: npm run session

      - name: Build
        working-directory: panel_src
        run: npm run build

      - name: The committed bundle is the one the source builds
        # The whole point of committing a build artefact. HACS copies
        # custom_components/myhome/ as it exists at the tag, so the file in the tree
        # is what users run; this is the only thing standing between that and a
        # bundle edited by hand, built from an older source, or forgotten entirely.
        run: git diff --exit-code -- custom_components/myhome/frontend
