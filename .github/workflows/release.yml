name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      name:
        description: 'Release name (optional)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history and tags: the release notes come from CHANGELOG.md, and
          # the local half of the tag guard below is `git rev-parse`, which can
          # only see tags that were fetched. (The guard also asks the remote, so
          # it no longer *depends* on this - but a shallow checkout would still
          # leave the history the rest of the job assumes out of the runner.)
          fetch-depth: 0

      - name: Check if tag already exists
        run: |
          TAG="${{ github.event.inputs.tag }}"
          # Ask the remote first. `git rev-parse` answers from the local object
          # store, so on a checkout that did not bring the tags down it says "no
          # such tag" for a tag that already exists on GitHub - and the job would
          # then go on to bump the version, commit it and *push the commit to the
          # branch*, dying only afterwards on `git push origin <tag>`.
          # `git ls-remote` asks the remote itself and does not depend on the
          # fetch depth. `--exit-code` is what makes a miss non-zero.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Error: Tag $TAG already exists on the remote"
            exit 1
          fi
          # And the local checkout, for a tag created here but never pushed.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Error: Tag $TAG already exists"
            exit 1
          fi

      - name: Generate release notes from CHANGELOG.md
        run: |
          # Tags are `v` + version; the script takes the bare version and must run
          # from the repository root (it opens "CHANGELOG.md" relatively).
          VERSION="${{ github.event.inputs.tag }}"
          VERSION="${VERSION#v}"
          python3 scripts/release_notes.py "$VERSION" > /tmp/notes-body.md
          {
            echo "# MyHOME Integration Release ${{ github.event.inputs.tag }}"
            echo
            echo "## Installation"
            echo
            echo "### HACS (recommended)"
            echo "1. Add this repository as a custom repository in HACS"
            echo "2. Install the MyHOME integration"
            echo "3. Restart Home Assistant"
            echo
            echo "### Manual installation"
            echo "1. Download \`myhome.zip\` from the assets below"
            echo "2. Extract it into \`custom_components/myhome/\` in your Home Assistant"
            echo "   configuration directory (the archive holds the integration's files"
            echo "   themselves, with no top-level folder)"
            echo "3. Restart Home Assistant"
            echo
            echo "## Changelog"
            echo
            cat /tmp/notes-body.md
          } > /tmp/notes.md
          cat /tmp/notes.md

      - name: Set the manifest version and commit it
        # BEFORE the tag, on purpose: HACS reads manifest.json *from the tag*, and
        # the zip below is built from this same checkout. Bumping afterwards (as
        # this job used to) tags and ships a manifest that still says the previous
        # version, so HACS installs vX.Y.Z and reports X.Y.Z-1 for ever.
        run: |
          VERSION="${{ github.event.inputs.tag }}"
          VERSION="${VERSION#v}"
          export VERSION
          sed -i 's/"version": "[^"]*"/"version": "'"$VERSION"'"/' \
            custom_components/myhome/manifest.json
          # An assertion, not the warning nobody reads: if the sed missed, stop
          # here - before the tag exists and before anything is published.
          python3 - <<'PY'
          import json, os, sys

          version = os.environ["VERSION"]
          got = json.load(open("custom_components/myhome/manifest.json"))["version"]
          sys.exit(0 if got == version else f"manifest.json says {got}, expected {version}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet custom_components/myhome/manifest.json; then
            echo "manifest.json already at $VERSION"
          else
            git add custom_components/myhome/manifest.json
            git commit -m "Update manifest version to $VERSION"
            git push origin HEAD:"${{ github.ref_name }}"
          fi

      - name: Create and push tag
        # HEAD is now the bumped commit, so the tag covers it.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ github.event.inputs.tag }}"
          git push origin "${{ github.event.inputs.tag }}"

      - name: Create myhome.zip
        # Built from the bumped checkout, so the asset carries the right version too.
        run: |
          cd custom_components/myhome
          zip -r ../../myhome.zip .
          cd ../..
          ls -la myhome.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.name || github.event.inputs.tag }}
          body_path: /tmp/notes.md
          files: |
            myhome.zip
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
