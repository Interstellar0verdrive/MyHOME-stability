name: Create Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string
      name:
        description: 'Release name (optional)'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Full history and tags: the guard below needs `git rev-parse` to see
          # the existing tags, and the release notes come from CHANGELOG.md.
          fetch-depth: 0

      - name: Check if tag already exists
        run: |
          if git rev-parse "${{ github.event.inputs.tag }}" >/dev/null 2>&1; then
            echo "Error: Tag ${{ github.event.inputs.tag }} already exists"
            exit 1
          fi

      - name: Generate release notes from CHANGELOG.md
        run: |
          # Tags are `v` + version; the script takes the bare version and must run
          # from the repository root (it opens "CHANGELOG.md" relatively).
          VERSION="${{ github.event.inputs.tag }}"
          VERSION="${VERSION#v}"
          python3 scripts/release_notes.py "$VERSION" > /tmp/notes-body.md
          {
            echo "# MyHOME Integration Release ${{ github.event.inputs.tag }}"
            echo
            echo "## Installation"
            echo
            echo "### HACS (recommended)"
            echo "1. Add this repository as a custom repository in HACS"
            echo "2. Install the MyHOME integration"
            echo "3. Restart Home Assistant"
            echo
            echo "### Manual installation"
            echo "1. Download \`myhome.zip\` from the assets below"
            echo "2. Extract it into \`custom_components/myhome/\` in your Home Assistant"
            echo "   configuration directory (the archive holds the integration's files"
            echo "   themselves, with no top-level folder)"
            echo "3. Restart Home Assistant"
            echo
            echo "## Changelog"
            echo
            cat /tmp/notes-body.md
          } > /tmp/notes.md
          cat /tmp/notes.md

      - name: Create and push tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ github.event.inputs.tag }}"
          git push origin "${{ github.event.inputs.tag }}"

      - name: Create myhome.zip
        run: |
          cd custom_components/myhome
          zip -r ../../myhome.zip .
          cd ../..
          ls -la myhome.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.name || github.event.inputs.tag }}
          body_path: /tmp/notes.md
          files: |
            myhome.zip
          prerelease: ${{ github.event.inputs.prerelease }}
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest version
        if: success()
        run: |
          # Extract version number without 'v' prefix
          VERSION="${{ github.event.inputs.tag }}"
          VERSION="${VERSION#v}"

          # Update manifest.json
          sed -i 's/"version": "[^"]*"/"version": "'$VERSION'"/' custom_components/myhome/manifest.json

          # Check if version was updated
          if git diff --quiet custom_components/myhome/manifest.json; then
            echo "Warning: manifest.json was not updated"
          else
            echo "Updated manifest.json version to $VERSION"
            git add custom_components/myhome/manifest.json
            git commit -m "Update manifest version to $VERSION"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
