name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A branch pushed inside this repository would otherwise run the job twice (once
# for the push, once for the pull request).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # The versions this integration targets (see docs/development.md).
          python-version: "3.14"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install \
            "homeassistant==2026.9.0" \
            "OWNd==0.7.49" \
            pytest pytest-timeout \
            "pytest-homeassistant-custom-component==0.13.363" \
            ruff

      - name: Lint
        # ruff.toml at the repository root pins the rule set, so this gives the
        # same answer here and on a developer's machine.
        run: ruff check .

      - name: Test
        run: pytest tests -q
