name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# A branch pushed inside this repository would otherwise run the job twice (once
# for the push, once for the pull request).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # The versions this integration targets (see docs/development.md).
          python-version: "3.14"
          cache: pip
          # The pip cache is keyed on this file; without it setup-python looks
          # for a requirements.txt / pyproject.toml and fails.
          cache-dependency-path: requirements_test.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_test.txt

      - name: Lint
        # ruff.toml at the repository root pins the rule set, so this gives the
        # same answer here and on a developer's machine.
        run: ruff check .

      - name: Test
        run: pytest tests -q
