# Test configuration (HA 2026.9 + pytest-homeassistant-custom-component).
# asyncio_mode=auto is required by the HA test plugin's autouse async fixtures.
[pytest]
testpaths = tests
asyncio_mode = auto

# NOTE: these are the *ini* options, deliberately not `addopts = --strict-markers
# --strict-config`. On pytest 9 those flags are `OverrideIniAction`s that only take
# effect when they come from the real command line; from `addopts` they set
# `config.option.strict_markers` (which reads back as True) while the mark check
# in _pytest/mark/structures.py consults `config.getini("strict_markers")`, which
# stays unset. The flag form therefore looks applied and silently does nothing.
#
# strict_markers: a typo in a `@pytest.mark.<name>` is an error, not a warning, so
# the `markers` list below is load-bearing.
# strict_config: an unknown key in this file is an error rather than a warning.
strict_markers = true
strict_config = true

markers =
    slow: takes about a second or more on its own (CI can split these out).

# No test here should ever need a minute; the slowest is ~1.3 s. The cap exists for
# the failure mode the gateway/session tests can produce, where a regression leaves
# a loop spinning or a reader parked on a socket nobody will write to: without it
# the run hangs instead of reporting, which is what a CI job cannot recover from.
timeout = 60
